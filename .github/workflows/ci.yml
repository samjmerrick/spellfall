name: CI

# PRs are checked once (not again for the branch push); main is checked. The live site is deployed by pages.yml
# once this workflow succeeds on main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; a run on main is never cut short.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm typecheck
      # Unit tests with the coverage gate, then the simulation tests (10,000 bot matches, 500 bot runs).
      - run: pnpm coverage
      - run: pnpm test:sim

  e2e:
    runs-on: ubuntu-latest
    # Browsers and their system libraries come preinstalled. Keep the tag equal to @playwright/test
    # in package.json (tests/unit/ci.test.ts checks this).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/screens
          if-no-files-found: ignore
